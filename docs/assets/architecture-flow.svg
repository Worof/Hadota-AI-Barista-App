<rect x="55" y="226" width="200" height="56" rx="12" fill="#b8322a" stroke="#d9483e" stroke-width="1.5"/><text x="155.0" y="250" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Engine · engine.js</text><text x="155.0" y="269" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="11" fill="#ffe3dd">rules → LinUCB → taste offsets</text>
