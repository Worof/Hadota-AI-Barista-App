<rect x="625" y="274" width="240" height="52" rx="12" fill="#fffaf1" stroke="#e0cdb2" stroke-width="1.5"/><text x="745.0" y="298" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="14" font-weight="700" fill="#2b1a10">RPC trending_topics()</text><text x="745.0" y="317" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="11" fill="#7b6554">counts only, no private text</text><rect x="625" y="334" width="240" height="48" rx="12" fill="#fffaf1" stroke="#e0cdb2" stroke-width="1.5"/><text x="745.0" y="358" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="14" font-weight="700" fill="#2b1a10">Edge Function ask-hadota</text><text x="745.0" y="377" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="11" fill="#7b6554">server-side LLM key</text>
<rect x="250" y="372" width="290" height="56" rx="12" fill="#fff4d6" stroke="#e8b86a" stroke-width="1.5"/><text x="395.0" y="396" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="14" font-weight="700" fill="#2b1a10">Optional LLM provider</text><text x="395.0" y="415" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="11" fill="#7b6554">Nile-Chat / ALLaM / Jais (OpenAI-compatible)</text>
<text x="215" y="66" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="11" fill="#7b6554">index.html · app.js · assets</text>
<text x="430" y="228" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="11" fill="#b8322a">supabase-js: auth, tables, chat, events (anon key + user JWT)</text>
<text x="430" y="285" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="11" fill="#3f4a2b">rows the user is allowed to see (RLS)</text>
